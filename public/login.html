<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="hero">

<h1>Login</h1>

<input
id="email"
placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Password">

<br><br>

<button
class="primary"
onclick="login()">

Login

</button>

</section>

<script>

async function login(){

const email=
document.getElementById("email").value;

const password=
document.getElementById("password").value;

const response=
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

});

const data=
await response.json();

if(data.success){

window.location.href=
"dashboard.html";

}else{

alert("Invalid login");

}

}

</script>

</body>
</html>
