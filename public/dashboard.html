<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>IntentStudio Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

<div class="logo">
IntentStudio Dashboard
</div>

</nav>

<section class="hero">

<h1>
Campaign Generator
</h1>

<p>
Generate AI campaigns instantly
</p>

</section>

<section class="features">

<div class="card">

<h3>
Campaign Prompt
</h3>

<textarea
id="prompt"
style="
width:100%;
height:140px;
padding:15px;
border-radius:12px;
">

</textarea>

<br><br>

<button
class="primary"
onclick="generateIntent()">

Generate

</button>

</div>

</section>

<section class="features">

<h2>
Results
</h2>

<div class="grid">

<div class="card" id="result1">
Waiting...
</div>

<div class="card" id="result2">
Waiting...
</div>

<div class="card" id="result3">
Waiting...
</div>

<div class="card" id="result4">
Waiting...
</div>

</div>

</section>

<script>

async function generateIntent(){

const prompt =
document.getElementById("prompt").value;

try{

const response =
await fetch("/api/intent",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
intent:prompt
})

});

const data =
await response.json();

document.getElementById("result1")
.innerHTML =
`Intent: ${data.receivedIntent}`;

document.getElementById("result2")
.innerHTML =
"Creative Variant A";

document.getElementById("result3")
.innerHTML =
"Creative Variant B";

document.getElementById("result4")
.innerHTML =
"Creative Variant C";

}catch(err){

document.getElementById("result1")
.innerHTML =
"API Error";

}

}

</script>

</body>

</html>
