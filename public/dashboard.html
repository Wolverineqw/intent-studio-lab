<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>IntentStudio Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

<div class="logo">
IntentStudio Dashboard
</div>

</nav>

<section class="hero">

<h1>
Create Campaign
</h1>

<p>
AI Powered Creative Studio
</p>

</section>

<section class="features">

<div class="card">

<h3>Campaign Prompt</h3>

<textarea
id="prompt"
placeholder="Describe your campaign..."
style="
width:100%;
height:120px;
padding:15px;
background:#121212;
color:white;
border-radius:12px;
">
</textarea>

<br><br>

<button
class="primary"
onclick="generateCampaign()">
Generate
</button>

</div>

</section>

<section class="features">

<h2>
Creative Results
</h2>

<div class="grid">

<div class="card" id="creative1">
Creative Slot 1
</div>

<div class="card" id="creative2">
Creative Slot 2
</div>

<div class="card" id="creative3">
Creative Slot 3
</div>

<div class="card" id="creative4">
Creative Slot 4
</div>

</div>

</section>

<section class="features">

<h2>
Performance
</h2>

<div class="grid">

<div class="card">
CTR
<h2>+212%</h2>
</div>

<div class="card">
CPA
<h2>-38%</h2>
</div>

<div class="card">
ROAS
<h2>4.8x</h2>
</div>

</div>

</section>

<script src="app.js"></script>

<script>

function generateCampaign(){

const prompt =
document.getElementById("prompt").value;

document.getElementById("creative1")
.innerHTML =
"Creative Variant A";

document.getElementById("creative2")
.innerHTML =
"Creative Variant B";

document.getElementById("creative3")
.innerHTML =
"Creative Variant C";

document.getElementById("creative4")
.innerHTML =
"Creative Variant D";

}

</script>

</body>

</html>
