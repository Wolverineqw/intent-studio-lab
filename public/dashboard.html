<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>IntentStudio Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

<div class="logo">
IntentStudio Dashboard
</div>

</nav>

<section class="hero">

<h1>
Campaign Generator
</h1>

<p>
Create ad campaigns instantly
</p>

</section>

<section class="features">

<div class="card">

<h3>
Describe your campaign
</h3>

<textarea
id="prompt"
style="
width:100%;
height:120px;
padding:15px;
border-radius:12px;
">

</textarea>

<br><br>

<button
class="primary"
onclick="generateCampaign()">

Generate

</button>

</div>

</section>

<section class="features">

<h2>
Creative Results
</h2>

<div class="grid">

<div class="card" id="result1">
Creative A
</div>

<div class="card" id="result2">
Creative B
</div>

<div class="card" id="result3">
Creative C
</div>

<div class="card" id="result4">
Creative D
</div>

</div>

</section>

<script>

function generateCampaign(){

const prompt =
document.getElementById("prompt").value;

document.getElementById("result1")
.innerHTML =
"Generated from: " + prompt;

document.getElementById("result2")
.innerHTML =
"Facebook Ad Variant";

document.getElementById("result3")
.innerHTML =
"Instagram Ad Variant";

document.getElementById("result4")
.innerHTML =
"Video Campaign Variant";
}

</script>

</body>
</html>
